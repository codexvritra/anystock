[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
robinhood = "${RH_RPC_URL}"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "blockscout", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "blockscout", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
